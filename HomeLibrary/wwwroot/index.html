<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Домашняя библиотека</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <header class="header">
        <h1>📚 Домашняя библиотека</h1>
        <a href="/book.html" class="btn btn-primary">+ Добавить книгу</a>
    </header>

    <main class="container">
        <div class="search-bar">
            <input type="text"
                   id="searchInput"
                   placeholder="Поиск по названию, автору или оглавлению…"
                   autocomplete="off">
            <button id="searchBtn" class="btn">Найти</button>
            <button id="clearBtn" class="btn btn-secondary">Сбросить</button>
        </div>

        <div id="status" class="status"></div>

        <table class="books-table" id="booksTable">
            <thead>
                <tr>
                    <th style="width:60px;">ID</th>
                    <th>Название</th>
                    <th>Автор</th>
                    <th style="width:100px;">Год</th>
                    <th style="width:200px;">Действия</th>
                </tr>
            </thead>
            <tbody id="booksBody">
                <!-- строки добавляются через JS -->
            </tbody>
        </table>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/list.js"></script>
</body>
</html>
